<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>우리은하 탐사 일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: mission route strip on top, one task card per screen; galaxy-map station path as the home view. Deliberately single dark "deep space" look so the photos read. */
:root{
  color-scheme: dark;
  --void:#0d0b1f;       /* deep space */
  --deck:#17143a;       /* card */
  --deck-2:#221d52;
  --rim:#352e78;
  --text:#ecebff;
  --dim:#a9a5d6;
  --nebula:#5ee7df;     /* teal accent from reflection nebula */
  --nebula-ink:#052826;
  --rose:#ff7eb6;       /* emission-pink secondary */
  --gold:#ffd166;       /* stars earned */
  --ok:#7ef0a8;
  --bad:#ff8f8f;
  --display:"Jua","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  background:var(--void) radial-gradient(900px 500px at 85% -5%, #2a1d63 0%, transparent 60%), radial-gradient(700px 500px at -10% 110%, #3a1450 0%, transparent 55%);
  background-attachment:fixed;
  color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 56px;
  -webkit-tap-highlight-color:transparent;
}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(2.3rem,8vw,3.6rem);line-height:1.08}
h2{font-size:1.6rem;line-height:1.25}
h3{font-size:1.2rem}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--nebula)}
.dim{color:var(--dim)}
.card{background:var(--deck);border:1px solid var(--rim);border-radius:18px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--rim);background:var(--deck-2);color:var(--text);padding:12px 18px;font-weight:500;touch-action:manipulation}
button:hover{border-color:var(--nebula)}
button:focus-visible,input:focus-visible,.chip:focus-visible,.zone:focus-visible{outline:2px solid var(--nebula);outline-offset:2px}
button.go{background:var(--nebula);color:var(--nebula-ink);border-color:var(--nebula);font-weight:700;font-family:var(--display);font-size:1.1rem;letter-spacing:.02em}
button.go:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:none;color:var(--dim);text-decoration:underline;padding:6px}
input{font:inherit;font-size:1.1rem;color:var(--text);background:var(--void);border:1px solid var(--rim);border-radius:12px;padding:12px 14px;width:100%}

/* home */
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--rim);min-height:220px;display:flex;align-items:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%, rgba(13,11,31,.92) 100%)}
.hero .in{position:relative;z-index:1;padding:20px;display:flex;flex-direction:column;gap:6px}
.route{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:relative}
.stn{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--deck);border:1px solid var(--rim);border-radius:14px;padding:12px 6px;min-width:0;color:var(--text)}
.stn .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;background:var(--void);border:2px solid var(--rim)}
.stn.done .ic{border-color:var(--gold);color:var(--gold)}
.stn.next .ic{border-color:var(--nebula);color:var(--nebula);box-shadow:0 0 0 4px color-mix(in srgb,var(--nebula) 20%, transparent)}
.stn .nm{font-size:.82rem;line-height:1.3}
.stn .st{font-size:.8rem;color:var(--gold);letter-spacing:.05em;min-height:1.2em}
.stn.locked{opacity:.5}
@media (max-width:560px){.route{grid-template-columns:1fr}.stn{flex-direction:row;text-align:left;padding:10px 12px}.stn .nm{flex:1}}
.totals{display:flex;gap:10px;flex-wrap:wrap}
.tot{background:var(--void);border:1px solid var(--rim);border-radius:12px;padding:8px 14px;font-family:var(--mono);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:baseline}
.tot b{font-size:1.2rem;color:var(--gold)}

/* hud */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog{display:flex;gap:4px;flex:1;min-width:160px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--rim)}
.prog i.d{background:var(--nebula)}
.prog i.c{background:var(--gold)}
.pill{font-family:var(--mono);font-size:.8rem;border:1px solid var(--rim);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.combo{border-color:var(--rose);color:var(--rose)}
.pill.combo.big{background:var(--rose);color:#2a0618}
.bump{animation:bump .45s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}

/* task */
.task{display:flex;flex-direction:column;gap:16px}
.q{font-size:1.12rem;font-weight:500;line-height:1.65}
.kind{font-family:var(--mono);font-size:.74rem;color:var(--rose);letter-spacing:.1em}
.photo{border-radius:14px;overflow:hidden;border:1px solid var(--rim);background:#000;position:relative}
.photo img{display:block;width:100%;height:auto;max-width:100%}
.opts{display:grid;gap:10px}
.opt{text-align:left;display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--void)}
.opt .k{font-family:var(--mono);color:var(--nebula);min-width:1.4em}
.opt.wrong{border-color:var(--bad);opacity:.55}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%, var(--void))}
.feedback{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 9%, var(--deck))}
.feedback.no{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%, var(--deck))}
.feedback b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.feedback.ok b{color:var(--ok)} .feedback.no b{color:var(--bad)}
.earned{color:var(--gold);letter-spacing:.1em}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* drag & drop */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:1px dashed var(--rim);border-radius:14px;background:color-mix(in srgb,var(--void) 60%, transparent)}
.tray:empty::before{content:"모든 카드를 옮겼어요. 확인을 눌러 보세요.";color:var(--dim);font-size:.9rem;padding:4px}
.chip{user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;background:var(--deck-2);border:1px solid var(--nebula);color:var(--text);border-radius:10px;padding:8px 12px;font-size:.95rem;line-height:1.35;max-width:100%}
.chip.sel{background:var(--nebula);color:var(--nebula-ink);font-weight:700}
.chip.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%, var(--deck-2));cursor:default}
.chip.badc{border-color:var(--bad);animation:shake .35s}
.ghost-chip{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:.95}
.zone{transition:border-color .15s, background .15s}
.zone.hover{border-color:var(--nebula)!important;background:color-mix(in srgb,var(--nebula) 14%, transparent)!important}
.zone.armed{border-style:dashed!important;border-color:var(--nebula)!important}
/* photo match grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.pzone{display:flex;flex-direction:column;border:2px solid var(--rim);border-radius:14px;overflow:hidden;background:var(--void);min-width:0}
.pzone img{display:block;width:100%;aspect-ratio:1/0.9;object-fit:cover;max-width:100%}
.pzone .slot{min-height:54px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.pzone .slot:empty::before{content:"여기에 놓기";color:var(--dim);font-size:.85rem}
.pzone .cap{font-size:.78rem;color:var(--dim);padding:6px 10px 0;text-align:center}
/* sort bins */
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bin{border:2px solid var(--rim);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px;background:var(--void);min-width:0}
.bin h3{display:flex;align-items:center;gap:8px}
.bin .slot{display:flex;flex-direction:column;gap:6px;flex:1}
.bin .slot:empty::before{content:"여기에 카드를 놓으세요";color:var(--dim);font-size:.85rem}
.bin .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover}
/* image spots */
.spotwrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--rim);background:#000}
.spotwrap img{display:block;width:100%;height:auto;max-width:100%}
.spot{position:absolute;transform:translate(-50%,-50%);min-width:64px;min-height:40px;border:2px dashed rgba(255,255,255,.75);border-radius:12px;background:rgba(13,11,31,.55);display:flex;align-items:center;justify-content:center;padding:4px}
.spot .slot{display:flex}
.spot .slot:empty::before{content:attr(data-n);font-family:var(--mono);font-size:.9rem;color:#fff}
.spot .chip{white-space:nowrap;font-size:.8rem;padding:4px 8px;max-width:30vw;max-width:min(30vw,180px)}
.ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.spot{z-index:2}
.spot .slot:empty::before{font-size:1.1rem}
.spotdot{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3);transform:translate(-50%,-50%)}
/* tap map */
.tapmap{cursor:crosshair}
.scale{position:absolute;left:10.8%;right:10.6%;bottom:4%;height:18px;border-left:2px solid #fff;border-right:2px solid #fff;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scale::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px solid rgba(255,255,255,.8)}
.scale span{position:relative;background:#000;padding:0 8px;font-family:var(--mono);font-size:.78rem;color:#fff}
.mark{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.mark.you{width:22px;height:22px;border-radius:50%;border:3px solid var(--rose);box-shadow:0 0 12px var(--rose)}
.mark.real{display:flex;flex-direction:column;align-items:center;gap:2px}
.mark.real i{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.mark.real span{font-size:.75rem;background:rgba(0,0,0,.7);padding:1px 6px;border-radius:6px;color:var(--gold);white-space:nowrap}
.ring{position:absolute;border:2px dashed var(--gold);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:.75}
/* OX speed */
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{font-family:var(--display);font-size:2.4rem;padding:18px;background:var(--void)}
.ox .o{color:var(--nebula)} .ox .x{color:var(--rose)}
.timer{height:8px;border-radius:4px;background:var(--rim);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.oxstmt{font-size:1.2rem;font-weight:500;min-height:3.4em;display:flex;align-items:center}
/* end */
.badge{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--gold);padding:22px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 12%, var(--deck)),var(--deck) 60%)}
.badge .rank{font-family:var(--display);font-size:2rem;color:var(--gold);line-height:1.15}
.badge .nm{font-size:1.1rem}
.starsbig{font-size:1.6rem;letter-spacing:.12em;color:var(--gold)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.dexc{border:1px solid var(--rim);border-radius:12px;overflow:hidden;background:var(--void);display:flex;flex-direction:column;min-width:0}
.dexc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;max-width:100%}
.dexc span{font-size:.8rem;padding:6px 8px;line-height:1.35}
.dexc.lock img{filter:brightness(.15) blur(2px)}
.dexc.lock span{color:var(--dim)}
.newcard{display:flex;gap:12px;align-items:center;border:1px solid var(--gold);border-radius:12px;padding:10px;background:color-mix(in srgb,var(--gold) 8%, var(--void))}
.newcard img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.svgbox{border-radius:14px;border:1px solid var(--rim);background:#05040f;overflow:hidden}
.svgbox svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const fx = (()=>{ const c=$("#fx"), x=c.getContext("2d"); let parts=[], raf=null;
  const size=()=>{c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;};
  size(); addEventListener("resize",size);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function loop(){ x.clearRect(0,0,c.width,c.height);
    parts=parts.filter(p=>p.life>0);
    for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; x.globalAlpha=Math.max(0,p.life/p.max);
      x.fillStyle=p.c; x.beginPath();
      if(p.star){ const r=p.r; for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2, rr=k%2?r*.45:r; x.lineTo(p.x+Math.cos(a)*rr,p.y+Math.sin(a)*rr);} }
      else x.arc(p.x,p.y,p.r,0,7);
      x.fill(); }
    x.globalAlpha=1;
    raf = parts.length? requestAnimationFrame(loop) : null; }
  function burst(px,py,n=26,opts={}){ if(reduce) return; const d=devicePixelRatio;
    const cols=opts.cols||["#ffd166","#5ee7df","#ff7eb6","#ffffff"];
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=(opts.speed||5)*(.4+Math.random());
      parts.push({x:px*d,y:py*d,vx:Math.cos(a)*s*d,vy:Math.sin(a)*s*d-(opts.up||2)*d,g:.12*d,r:(2+Math.random()*4)*d,c:cols[i%cols.length],life:60+Math.random()*30,max:90,star:Math.random()<.5}); }
    if(!raf) loop(); }
  function rain(){ for(let k=0;k<5;k++) setTimeout(()=>burst(innerWidth*(.15+.7*Math.random()), innerHeight*(.2+.3*Math.random()), 40, {speed:7}), k*220); }
  return {burst, rain};
})();
function burstAt(el,n){ if(!el) return; const r=el.getBoundingClientRect(); fx.burst(r.left+r.width/2, r.top+r.height/2, n); }

function startMission(mi){ cur={mi, si:0, stars:[]}; combo=0; viewStep(); }

function hud(){
  const m=MISSIONS[cur.mi];
  return `<div class="hud">
    <button class="link" id="home" style="padding:0">← 경로</button>
    <div class="prog" aria-label="진행">${m.steps.map((_,k)=>`<i class="${k<cur.si?(cur.stars[k]===3?"c":"d"):""}"></i>`).join("")}</div>

    <span class="pill">${esc(m.ic)} ${cur.si+1}/${m.steps.length}</span>
  </div>`;
}
function bindHud(){ $("#home").onclick=()=>{ stopOX(); viewHome(); }; }

function viewStep(){
  const m=MISSIONS[cur.mi], s=m.steps[cur.si];
  cur.tries=0; cur.locked=false;
  const head = `${hud()}<section class="card task" id="task">
    <span class="kind">${esc(s.kind || (s.type==="mc"?"골라 보기":""))}</span>
    ${s.type!=="ox"?`<p class="q">${esc(s.q)}</p>`:""}`;
  if(s.type==="mc") renderMC(head,s);
  else if(s.type==="photo"||s.type==="sort"||s.type==="spots") renderDnD(head,s);
  else if(s.type==="tap") renderTap(head,s);
  else if(s.type==="ox") renderOX(head,s);
  bindHud();
}

function starsFor(tries){ return tries<=0?3:tries===1?2:1; }

function finishStep(stars, msg, extra=""){
  cur.locked=true;
  cur.stars[cur.si]=stars;
  if(stars===3){ combo++; P.bestCombo=Math.max(P.bestCombo||0,combo); } else combo = stars>=2?combo:0;
  save();
  const cb=$("#combo"); if(cb){ cb.hidden=combo<2; cb.textContent=`콤보 ×${combo}`; cb.classList.toggle("big",combo>=5); cb.classList.remove("bump"); void cb.offsetWidth; cb.classList.add("bump"); }
  const last = cur.si===MISSIONS[cur.mi].steps.length-1;
  const praise = stars===3 ? (combo>=5?`${combo}연속 만점! 우주 최강 관측력`:combo>=3?`${combo}연속 만점!`:"한 번에 정답!") : stars===2 ? "두 번째 시도에 성공!" : "끝까지 해냈어요!";
  $("#fb").innerHTML = `<div class="feedback ok"><b>${esc(praise)}</b><span class="earned">${starStr(stars)}</span><span>${esc(msg)}</span>${extra}</div>
    <div class="row" style="margin-top:12px"><button class="go" id="nx">${last?"정거장 통과":"다음"}</button></div>`;
  burstAt($("#fb .earned"), stars*12);
  $("#nx").focus();
  $("#nx").onclick=()=>{ if(last) missionClear(); else { cur.si++; viewStep(); } };
}
function missFeedback(text){
  const t=$("#task"); t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
  if(combo>=2){ $("#fbmsg").textContent = `콤보 ${combo}이(가) 끊겼어요. ${text}`; } else $("#fbmsg").textContent = text;
  combo=0; const cb=$("#combo"); if(cb) cb.hidden=true;
}

function renderMC(head,s){
  const order = s.o.map((t,k)=>k);
  $("#app").innerHTML = `${head}
    ${s.img?`<figure class="photo" style="margin:0"><img src="${s.img}" alt="${esc(s.cap||"")}"></figure>`:""}
    ${s.svg?`<div class="svgbox">${s.svg}</div>`:""}
    <div class="opts" id="opts">${order.map((k,i)=>`<button class="opt" data-k="${k}"><span class="k">${"①②③④⑤"[i]}</span><span>${esc(s.o[k])}</span></button>`).join("")}</div>
    <p id="fbmsg" class="dim" aria-live="polite" style="min-height:1.4em"></p><div id="fb"></div></section>`;
  $("#opts").addEventListener("click", e=>{
    const b=e.target.closest(".opt"); if(!b||cur.locked||b.disabled) return;
    const k=+b.dataset.k;
    if(k===s.a){ b.classList.add("right"); $$(".opt").forEach(x=>x.disabled=true); $("#fbmsg").textContent=""; finishStep(starsFor(cur.tries), s.x); }
    else { b.classList.add("wrong"); b.disabled=true; cur.tries++; missFeedback("다시 골라 보세요."); }
  });
}

    zonesHTML = `<div class="bins">${s.zones.map(z=>`<div class="bin zone" data-z="${z.id}" data-cap="99" tabindex="0"><h3>${z.img?`<img class="thumb" src="${z.img}" alt="">`:""}${esc(z.t)}</h3><div class="slot"></div></div>`).join("")}</div>`;
  } else {
    zonesHTML = `<div class="spotwrap"><img src="${s.img}" alt="위에서 본 우리은하">${s.overlay||""}${s.zones.map(z=>`<div class="spot zone" data-z="${z.id}" data-cap="1" tabindex="0" style="left:${z.x}%;top:${z.y}%;${z.c?`border-color:${z.c};border-style:solid`:""}"><div class="slot" data-n="${esc(z.n)}"></div></div>`).join("")}</div>`;
  }
  $("#app").innerHTML = `${head}
    <p class="dim" style="font-size:.88rem">카드를 끌어다 놓거나, 카드를 누른 뒤 놓을 곳을 누르세요.</p>
    ${zonesHTML}
    <div class="tray zone" id="tray" data-z="tray" data-cap="99">${shuffle(s.chips).map(c=>`<button type="button" class="chip" data-c="${c.id}">${esc(c.t)}</button>`).join("")}</div>
    <div class="row"><button class="go" id="chk">확인</button><button class="ghost" id="clr">카드 모두 되돌리기</button></div>
    <p id="fbmsg" class="dim" aria-live="polite" style="min-height:1.4em"></p><div id="fb"></div></section>`;
  wireDnD();
  $("#clr").onclick=()=>{ if(cur.locked) return; $$(".zone:not(#tray) .chip:not(.good)").forEach(c=>$("#tray").appendChild(c)); };
  $("#chk").onclick=()=>{
    if(cur.locked) return;
    if($("#tray").querySelector(".chip")){ $("#fbmsg").textContent="아직 놓지 않은 카드가 있어요."; return; }
    let wrong=0;
    $$(".zone:not(#tray)").forEach(zel=>{
      const z=s.zones.find(q=>q.id===zel.dataset.z);
      zel.querySelectorAll(".chip:not(.good)").forEach(ch=>{
        if(z.accept.includes(ch.dataset.c)){ ch.classList.add("good"); ch.disabled=true; }
        else { wrong++; ch.classList.add("badc"); setTimeout(()=>{ ch.classList.remove("badc"); $("#tray").appendChild(ch); }, 450); }
      });
    });
    if(!wrong){ $("#chk").disabled=true; $("#clr").disabled=true; $("#fbmsg").textContent=""; finishStep(starsFor(cur.tries), s.x); }
    else { cur.tries++; missFeedback(`${wrong}장이 제자리가 아니에요. 맞힌 카드는 고정되고, 틀린 카드는 돌아왔어요.`); }
  };
}

let selChip=null;
function placeChip(ch, zel){
  if(!zel || ch.classList.contains("good")) return;
  const slot = zel.querySelector(".slot") || zel;
  const cap = +zel.dataset.cap;
  if(cap===1){ const prev = slot.querySelector(".chip"); if(prev && prev!==ch){ if(prev.classList.contains("good")) return; $("#tray").appendChild(prev); } }
  slot.appendChild(ch);
}
function clearSel(){ if(selChip) selChip.classList.remove("sel"); selChip=null; $$(".zone").forEach(z=>z.classList.remove("armed")); }
function wireDnD(){
  selChip=null;
  const root=$("#task");
  root.addEventListener("pointerdown", e=>{
    const ch=e.target.closest(".chip"); if(!ch||cur.locked||ch.classList.contains("good")) return;
    e.preventDefault();
    const sx=e.clientX, sy=e.clientY; let ghost=null, over=null;
    const move = ev=>{
      if(!ghost && Math.hypot(ev.clientX-sx, ev.clientY-sy)>6){ clearSel(); ghost=ch.cloneNode(true); ghost.classList.add("ghost-chip"); document.body.appendChild(ghost); ch.style.opacity=".3"; }
      if(ghost){ ghost.style.left=ev.clientX+"px"; ghost.style.top=ev.clientY+"px";
        const el=document.elementFromPoint(ev.clientX,ev.clientY); const z=el&&el.closest(".zone");
        if(over&&over!==z) over.classList.remove("hover"); over=z; if(z) z.classList.add("hover"); }
    };
    const up = ev=>{
      removeEventListener("pointermove",move); removeEventListener("pointerup",up); removeEventListener("pointercancel",up);
      if(ghost){ ghost.remove(); ch.style.opacity=""; if(over){ over.classList.remove("hover"); placeChip(ch, over); } }
      else { // 탭: 선택
        if(selChip===ch){ clearSel(); } else { clearSel(); selChip=ch; ch.classList.add("sel"); $$(".zone").forEach(z=>{ if(!z.contains(ch)) z.classList.add("armed"); }); }
      }
    };
    addEventListener("pointermove",move); addEventListener("pointerup",up); addEventListener("pointercancel",up);
  });
  root.addEventListener("click", e=>{
    if(!selChip||cur.locked) return;
    if(e.target.closest(".chip")) return;
    const z=e.target.closest(".zone"); if(!z) return;
    placeChip(selChip, z); clearSel();
  });
  root.addEventListener("keydown", e=>{
    if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("chip")){ e.preventDefault(); const ch=e.target; if(ch.classList.contains("good")) return;
      if(selChip===ch) clearSel(); else { clearSel(); selChip=ch; ch.classList.add("sel"); $$(".zone").forEach(z=>{ if(!z.contains(ch)) z.classList.add("armed"); }); } }
    else if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("zone") && selChip){ e.preventDefault(); placeChip(selChip,e.target); clearSel(); }
  });
}

/* ---- 사진에 위치 찍기 ---- */
function renderTap(head,s){
  $("#app").innerHTML = `${head}
    <div class="spotwrap tapmap" id="map" role="button" tabindex="0" aria-label="우리은하 사진. 태양계 위치를 누르세요">
      <img src="${s.img}" alt="위에서 본 우리은하" draggable="false">
      <div class="mark real" style="left:${s.cx}%;top:${s.cy}%"><i style="background:#fff;box-shadow:0 0 10px #fff;width:10px;height:10px"></i><span style="color:#fff">은하 중심</span></div>
      <div class="scale"><span>30000 pc</span></div>
    </div>
    <p id="fbmsg" class="dim" aria-live="polite" style="min-height:1.4em"></p><div id="fb"></div></section>`;
  const map=$("#map");
  map.addEventListener("click", e=>{
    if(cur.locked) return;
    const r=map.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width*100, py=(e.clientY-r.top)/r.height*100;
    const dx=(px-s.cx)/100*s.W, dy=(py-s.cy)/100*s.H, d=Math.hypot(dx,dy)/s.R;
    map.querySelectorAll(".mark.you").forEach(m=>m.remove());
    map.insertAdjacentHTML("beforeend",`<div class="mark you" style="left:${px}%;top:${py}%"></div>`);
    const pc = Math.round(d*15000/500)*500;
    if(d>=s.lo && d<=s.hi){
      const ringPct = (Math.hypot((s.real[0]-s.cx)/100*s.W,(s.real[1]-s.cy)/100*s.H))/s.W*200;
      map.insertAdjacentHTML("beforeend",`<div class="ring" style="left:${s.cx}%;top:${s.cy}%;width:${ringPct}%;aspect-ratio:1"></div><div class="mark real" style="left:${s.real[0]}%;top:${s.real[1]}%"><i></i><span>교과서 속 태양계</span></div>`);
      $("#fbmsg").textContent="";
      finishStep(starsFor(cur.tries), s.x, `<span class="dim">내가 찍은 곳: 중심에서 약 ${pc.toLocaleString()} pc</span>`);
    } else {
      cur.tries++;
      missFeedback(d<s.lo ? `중심에서 약 ${pc.toLocaleString()} pc예요. 태양계는 중심에서 더 떨어져 있어요.` : `중심에서 약 ${pc.toLocaleString()} pc예요. 너무 바깥쪽이에요. 반지름은 약 15000 pc예요.`);
    }
  });
}

/* ---- OX 스피드 ---- */
let oxT=null;
function stopOX(){ if(oxT){ clearInterval(oxT); oxT=null; } }
function renderOX(head,s){
  const deck=shuffle(s.items); let i=0, score=0, streak=0, left=s.sec, misses=[];
  $("#app").innerHTML = `${head}
    <div class="row" style="justify-content:space-between"><h2>OX 스피드 비행</h2><span class="pill" id="sc">0점</span></div>
    <p class="dim">${s.sec}초 동안 맞으면 O, 틀리면 X! 연속으로 맞히면 보너스 점수가 붙어요.</p>
    <div id="oxbody" class="stack"><button class="go" id="oxgo">시작</button></div>
    <p id="fbmsg" class="dim" aria-live="polite" style="min-height:1.4em"></p><div id="fb"></div></section>`;
  $("#oxgo").onclick=()=>{
    $("#oxbody").innerHTML = `<div class="timer"><i id="tbar" style="width:100%"></i></div>
      <div class="row" style="justify-content:space-between"><span class="pill" id="tleft">${left}초</span><span class="pill combo" id="ostreak" hidden></span></div>
      <p class="oxstmt" id="stmt"></p>
      <div class="ox"><button class="o" data-v="1" aria-label="O 맞다">O</button><button class="x" data-v="0" aria-label="X 틀리다">X</button></div>`;
    const show=()=>{ $("#stmt").textContent = deck[i % deck.length][0]; };
    show();
    oxT=setInterval(()=>{ left--; $("#tleft").textContent=left+"초"; $("#tbar").style.width=(left/s.sec*100)+"%"; if(left<=0) end(); },1000);
    $$(".ox button").forEach(b=>b.onclick=()=>{
      if(left<=0) return;
      const it=deck[i % deck.length], ans=b.dataset.v==="1";
      if(ans===it[1]){ streak++; const add = 10 + (streak>=3?5:0) + (streak>=6?5:0); score+=add; burstAt(b, 10+streak*2); $("#fbmsg").textContent = streak>=3?`${streak}연속! +${add}`:`정답 +${add}`; }
      else { streak=0; misses.push(it); $("#fbmsg").textContent = `아쉬워요. 정답은 ${it[1]?"O":"X"}${it[2]?" · "+it[2]:""}`; const t=$("#task"); t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake"); }
      $("#sc").textContent=score+"점";
      const os=$("#ostreak"); os.hidden=streak<2; os.textContent=`연속 ${streak}`;
      i++; if(i>=deck.length*2){ end(); return; } show();
    });
    function end(){
      stopOX(); $$(".ox button").forEach(b=>b.disabled=true);
      const newBest = score>(P.oxBest||0); if(newBest){ P.oxBest=score; save(); }
      const stars = score>=120?3:score>=70?2:1;
      $("#fbmsg").textContent="";
      const uniqMiss=[...new Map(misses.map(m=>[m[0],m])).values()];
      finishStep(stars, `${score}점${newBest?" · 최고 기록 갱신!":""} (★★★ 120점 이상, ★★ 70점 이상)`,
        uniqMiss.length?`<details><summary class="dim">틀린 문장 다시 보기 (${uniqMiss.length})</summary><ul style="margin:6px 0 0;padding-left:18px">${uniqMiss.map(m=>`<li>${esc(m[0])} → <b>${m[1]?"O":"X"}</b>${m[2]?` <span class="dim">${esc(m[2])}</span>`:""}</li>`).join("")}</ul></details>`:"");
    }
  };
}

/* ======================= 정거장 통과 ======================= */
function missionClear(){
  const m=MISSIONS[cur.mi];
  const prev = P.stars[m.key];
  const sum = cur.stars.reduce((a,b)=>a+b,0);
  const prevSum = prev?prev.reduce((a,b)=>a+b,0):-1;
  if(sum>prevSum) P.stars[m.key]=cur.stars.slice();
  save();
  const max=m.steps.length*3;
  const cards = DEX.filter(d=>m.dex.includes(d.id));
  const last = cur.mi===MISSIONS.length-1;
  $("#app").innerHTML = `
  <section class="card stack" style="text-align:center;align-items:center">
    <span class="eyebrow">${esc(m.ic)} 정거장 통과</span>
    <h1 style="font-size:clamp(2rem,7vw,2.8rem)">${esc(m.name)}</h1>
    <p class="starsbig" id="sb">${"★".repeat(sum)}<span style="opacity:.3">${"☆".repeat(max-sum)}</span></p>
    <p class="dim">별 ${sum} / ${max}${prevSum>=0 && sum<=prevSum?` · 이전 최고 ${prevSum}개 기록 유지`:prevSum>=0?" · 최고 기록 갱신!":""}</p>
    ${cards.length?`<div class="stack" style="width:100%;text-align:left"><span class="dim" style="font-size:.9rem">천체 도감에 추가된 카드</span>${cards.map(d=>`<div class="newcard"><img src="${d.img}" alt=""><span><b>${esc(d.name)}</b><br><span class="dim">${esc(d.note)}</span></span></div>`).join("")}</div>`:""}
    <div class="row" style="justify-content:center">
      ${last?`<button class="go" id="cert">탐사 대원증 받기</button>`:`<button class="go" id="nxm">다음 정거장 · ${esc(MISSIONS[cur.mi+1].name)}</button>`}
      <button class="ghost" id="again">다시 도전</button><button class="ghost" id="map">경로 보기</button>
    </div>
  </section>`;
  fx.rain();
  if($("#nxm")) $("#nxm").onclick=()=>startMission(cur.mi+1);
  if($("#cert")) $("#cert").onclick=viewCert;
  $("#again").onclick=()=>startMission(cur.mi);
  $("#map").onclick=viewHome;
}

/* ======================= 탐사 대원증 ======================= */
const RANKS = [
  {min:.95, r:"은하 탐사 대장", d:"우리은하 지도를 완벽하게 그려 낸 대원"},
  {min:.8,  r:"수석 은하 항해사", d:"성단과 성운을 정확히 구별하는 대원"},
  {min:.6,  r:"성운 탐사 대원", d:"은하수 너머를 탐험할 준비가 된 대원"},
  {min:0,   r:"견습 우주 비행사", d:"첫 탐사를 마친 용감한 대원. 다시 도전하면 별을 더 모을 수 있어요"}
];
function viewCert(){
  const ts=totalStars(), ratio=ts/MAX_STARS, R=RANKS.find(x=>ratio>=x.min);
  const today=new Date(); const ds=`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,"0")}.${String(today.getDate()).padStart(2,"0")}`;
  $("#app").innerHTML = `
  <section class="badge">
    <span class="eyebrow" style="color:var(--gold)">우리은하 탐사 대원증</span>
    <span class="nm">${esc(P.name)}</span>
    <span class="rank">${esc(R.r)}</span>
    <span>${esc(R.d)}</span>
    <span class="starsbig">★ ${ts} <span class="dim" style="font-size:1rem">/ ${MAX_STARS}</span></span>
    <div class="totals"><span class="tot">최고 콤보 <b>${P.bestCombo||0}</b></span><span class="tot">OX 최고 <b>${P.oxBest||0}</b></span><span class="tot">도감 <b>${DEX.length}</b>/${DEX.length}</span></div>
    <span class="dim" style="font-family:var(--mono);font-size:.8rem">${ds} · Ⅶ. 별과 우주 · 2. 우주</span>
  </section>
  <section class="card stack">
    <h3>정거장별 기록</h3>
    ${MISSIONS.map(m=>`<div class="row" style="justify-content:space-between"><span>${esc(m.ic)} ${esc(m.name)}</span><span class="earned" style="font-family:var(--mono)">${missionStars(m)} / ${m.steps.length*3}</span></div>`).join("")}
    <p class="dim" style="font-size:.88rem">이 화면을 캡처해 선생님께 보여 주세요. 별이 부족한 정거장은 다시 도전해서 기록을 올릴 수 있어요.</p>
    <button class="go" id="back">경로로 돌아가기</button>
  </section>`;
  fx.rain();
  $("#back").onclick=viewHome;
}

/* ======================= 배경 별 ======================= */
(function(){ const c=$("#sky"), x=c.getContext("2d"); let st=[];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function draw(t){ x.clearRect(0,0,c.width,c.height); for(const s of st){ const a=.35+.35*Math.sin(t/1400+s.p); x.fillStyle=`rgba(${s.c},${a})`; x.beginPath(); x.arc(s.x,s.y,s.s,0,7); x.fill(); } if(!reduce) requestAnimationFrame(draw); }
  let started=false;
  function init(){ c.width=innerWidth; c.height=innerHeight; st=[]; let seed=11; const r=()=>((seed=seed*16807%2147483647)/2147483647);
    for(let i=0;i<Math.floor(innerWidth*innerHeight/4500);i++) st.push({x:r()*c.width,y:r()*c.height,s:r()*1.3+.2,p:r()*6.28,c:r()<.12?"255,170,210":r()<.3?"160,240,235":"235,235,255"});
    if(reduce || !started){ started=true; draw(0); } }
  init(); addEventListener("resize",init);
})();

P ? viewHome() : viewStart();
